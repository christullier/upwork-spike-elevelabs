[project]
name = "audiobook-tts"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "elevenlabs>=2.75.0",
    "fastapi>=0.162.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
